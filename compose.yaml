
name: link-in-bio

services:
  app:
    build:
      context: .
    image: link-in-bio:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1"
      LINKS_FILE: /data/links.json
      CLICKS_LOG: /data/clicks.log
      AVATAR_FILE: /data/avatar.png
      OG_FILE: /data/og.png
      FAVICON_FILE: /data/favicon.svg
      BACKUP_DIR: /data/backups
    volumes:
      - data:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web

volumes:
  data:
    external: true
    name: link-in-bio_data

networks:
  web:
